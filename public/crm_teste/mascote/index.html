<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mascote ABA · animações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 35%,#16295f 0%,#0b122b 70%);color:#e6ebf1;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;gap:24px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-align:center}
.sub{margin:6px 0 0;font-size:14px;color:#aab3c5;text-align:center;max-width:560px}
.palco{position:relative;width:360px;max-width:100%;height:420px;display:flex;align-items:flex-end;justify-content:center}
.balao{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;color:#0b122b;font-size:15px;font-weight:600;padding:12px 16px;border-radius:14px;max-width:300px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .2s;z-index:2}
.balao::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.balao[hidden]{display:block!important;opacity:0}
/* Sprite: faixa de 24 quadros de 360x373, 12 fps, 2 s por ciclo */
.mascote{width:360px;height:373px;background-repeat:no-repeat;background-size:8640px 373px;animation:sprite 2s steps(24) infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
@keyframes sprite{from{background-position:0 0}to{background-position:-8640px 0}}
.troca{animation:sprite 2s steps(24) infinite,entra .22s ease-out}
@keyframes entra{from{transform:scale(.94);opacity:.3}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.mascote,.troca{animation:none}}
.grupo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rot{width:100%;text-align:center;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8d96ab;font-weight:600;margin-bottom:2px}
button{font:inherit;font-size:14px;font-weight:500;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e6ebf1;cursor:pointer}
button:hover{background:rgba(255,255,255,.12)}
button[aria-pressed="true"]{background:#00a79d;border-color:#00a79d;color:#0b122b;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:#fff;color:#0b122b;border-color:#fff;font-weight:600}
:focus-visible{outline:2px solid #7fe3dc;outline-offset:2px}
.nota{font-size:12.5px;color:#8d96ab;max-width:560px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Mascote ABA · animações</h1>
  <p class="sub">5 poses, cada uma com animação parada (respirando) e 4 delas falando. Clique para trocar.</p>
</header>

<div class="palco">
  <div class="balao" id="balao" hidden aria-live="polite"></div>
  <div class="mascote" id="mascote" role="img" aria-label="Mascote da ABA"></div>
</div>

<div class="grupo" role="group" aria-label="Pose">
  <div class="rot">Pose</div>
  <button type="button" data-pose="joia">Joia</button>
  <button type="button" data-pose="apontando">Apontando</button>
  <button type="button" data-pose="piscando">Piscando</button>
  <button type="button" data-pose="virado">Virado</button>
  <button type="button" data-pose="triste">Triste</button>
</div>
<div class="grupo">
  <button type="button" id="falar" aria-pressed="false">Falando</button>
  <button type="button" class="pri" id="roteiro">▶ Ver roteiro de exemplo</button>
</div>
<p class="nota">A troca de pose é um corte com um leve "pop" (não há quadros intermediários entre uma pose e outra). A pose Triste não tem versão falando.</p>

<script>
(function () {
  var el = document.getElementById('mascote'), balao = document.getElementById('balao');
  var btFalar = document.getElementById('falar');
  var estado = { pose: 'joia', falando: false };
  var temFala = { joia: true, apontando: true, piscando: true, virado: true, triste: false };

  // pré-carrega todas as faixas
  Object.keys(temFala).forEach(function (p) {
    new Image().src = p + '-parado-1x.webp';
    if (temFala[p]) new Image().src = p + '-falando-1x.webp';
  });

  function aplicar(trocouPose) {
    if (!temFala[estado.pose]) estado.falando = false;
    var anim = estado.falando ? 'falando' : 'parado';
    el.style.backgroundImage = 'url(' + estado.pose + '-' + anim + '-1x.webp)';
    if (trocouPose) { el.classList.remove('troca'); void el.offsetWidth; el.classList.add('troca'); }
    document.querySelectorAll('[data-pose]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-pose') === estado.pose);
    });
    btFalar.disabled = !temFala[estado.pose];
    btFalar.setAttribute('aria-pressed', estado.falando);
  }
  function dizer(txt) {
    balao.textContent = txt || '';
    balao.hidden = !txt;
  }

  document.querySelectorAll('[data-pose]').forEach(function (b) {
    b.onclick = function () { parar(); estado.pose = b.getAttribute('data-pose'); dizer(''); aplicar(true); };
  });
  btFalar.onclick = function () { parar(); estado.falando = !estado.falando; dizer(estado.falando ? 'Olá! Eu sou o assistente da ABA.' : ''); aplicar(false); };

  var roteiro = [
    ['apontando', true, 'Olha os números do mês aqui do lado!', 2600],
    ['joia', true, '58 vendas fechadas em outubro!', 2400],
    ['piscando', false, '', 1400],
    ['triste', false, 'Mas tivemos 6 cancelamentos…', 2400],
    ['virado', true, 'Vamos ver os motivos juntos?', 2600],
    ['joia', false, '', 0]
  ];
  var timer = null;
  function parar() { clearTimeout(timer); timer = null; }
  document.getElementById('roteiro').onclick = function () {
    parar();
    var i = 0;
    (function passo() {
      var s = roteiro[i++];
      estado.pose = s[0]; estado.falando = s[1]; dizer(s[2]); aplicar(true);
      if (i < roteiro.length) timer = setTimeout(passo, s[3]);
    })();
  };

  aplicar(false);
})();
</script>
</body>
</html>
